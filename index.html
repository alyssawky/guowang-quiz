<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>国网2027备考</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <p class="small-title">STATE GRID 2027</p>
            <h1>国网备考</h1>
            <p class="subtitle">学习 · 复习 · 掌握</p>
        </div>
    </header>


    <main>

        <!-- 顶部统计 -->
        <section class="summary-card">

            <div>
                <span class="summary-number" id="completed-count">0</span>
                <span class="summary-label">已完成</span>
            </div>

            <div>
                <span class="summary-number" id="review-count">0</span>
                <span class="summary-label">可复习</span>
            </div>

            <div>
                <span class="summary-number" id="total-count">0</span>
                <span class="summary-label">总任务</span>
            </div>

        </section>


        <!-- 当前学习计划 -->
        <section>

            <div class="section-title">
                <h2>当前学习计划</h2>
                <p>完成学习后，点击“标记完成”</p>
            </div>

            <div id="task-list"></div>

        </section>


        <!-- 已解锁复习 -->
        <section>

            <div class="section-title">
                <h2>已解锁复习</h2>
                <p>只有已经学习过的内容会出现在这里</p>
            </div>

            <div id="review-list"></div>

        </section>


        <!-- 开始复习 -->
        <section>

            <div class="section-title">
                <h2>开始复习</h2>
                <p>只会出现你已经完成学习的内容对应的题目</p>
            </div>

            <button id="start-review-btn">
                开始复习
            </button>

            <div id="quiz-area"></div>

        </section>


        <!-- 错题本：默认收起 -->
        <section>

            <details
                id="wrong-book"
                style="margin-top: 38px;"
            >

                <summary
                    style="
                        cursor: pointer;
                        font-size: 26px;
                        font-weight: 600;
                        margin-bottom: 18px;
                    "
                >
                    错题本

                    <span
                        id="wrong-total-count"
                        style="
                            margin-left: 8px;
                            color: #86868b;
                            font-size: 14px;
                            font-weight: 400;
                        "
                    >
                        0 道
                    </span>
                </summary>

                <p
                    style="
                        margin-top: -8px;
                        margin-bottom: 20px;
                        color: #86868b;
                        font-size: 14px;
                    "
                >
                    自动记录曾经答错的题目，并按板块分类
                </p>

                <div id="wrong-list"></div>

            </details>

        </section>

    </main>


    <script src="plan.js"></script>
    <script src="questions.js"></script>
    <script src="app.js"></script>

</body>

</html>
