<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国网2027备考</title>
    <link rel="stylesheet" href="style.css?v=20260815-5">
    <link rel="stylesheet" href="calculator-layout.css?v=20260815-5">
    <link rel="stylesheet" href="calculator-compact.css?v=20260815-6">
</head>
<body>

<header class="site-header">
    <div class="header-content top-dashboard">
        <div class="brand-panel">
            <p class="small-title">STATE GRID 2027</p>
            <h1>国网备考</h1>
            <p class="subtitle">学习 · 复习 · 掌握</p>

            <section class="summary-card">
                <div><span class="summary-number" id="completed-count">0</span><span class="summary-label">已完成</span></div>
                <div><span class="summary-number" id="review-count">0</span><span class="summary-label">可复习</span></div>
                <div><span class="summary-number" id="total-count">0</span><span class="summary-label">总任务</span></div>
            </section>
        </div>

        <aside class="calendar-card">
            <div class="calendar-heading">
                <div>
                    <div class="calendar-date" id="calendar-date">--</div>
                    <div class="calendar-day" id="calendar-day">--</div>
                </div>
                <div class="calendar-week" id="calendar-week">--</div>
            </div>
            <div class="week-strip" id="week-strip"></div>
            <div class="week-task-heading"><strong>本周任务</strong><span id="week-task-count">0 项</span></div>
            <div class="week-task-list" id="week-task-list"></div>
        </aside>
    </div>
</header>

<main>
    <section class="compact-section">
        <details id="study-checkin">
            <summary class="compact-summary">
                <span><strong>学习打卡</strong><small>只显示当前计划和逾期未完成</small></span>
                <span class="summary-count" id="visible-task-count">0 项</span>
            </summary>
            <div class="compact-body"><div id="task-list"></div></div>
        </details>
    </section>

    <section class="review-main">
        <div class="section-title review-title-row">
            <div><p class="eyebrow">REVIEW</p><h2>开始复习</h2><p>只会出现你已经完成学习的内容对应的题目</p></div>
            <button id="start-review-btn">开始复习</button>
        </div>
        <div id="quiz-area"></div>
    </section>

    <section class="compact-section">
        <details id="review-pool-book">
            <summary class="compact-summary">
                <span><strong>已解锁复习范围</strong><small>查看目前已经学过、可以出题的内容</small></span>
                <span class="summary-count" id="unlocked-task-count">0 项</span>
            </summary>
            <div class="compact-body"><div id="review-list"></div></div>
        </details>
    </section>

    <section class="compact-section">
        <details id="wrong-book">
            <summary class="compact-summary">
                <span><strong>错题本</strong><small>自动记录曾经答错的题目，并按板块分类</small></span>
                <span class="summary-count" id="wrong-total-count">0 道</span>
            </summary>
            <div class="compact-body"><div id="wrong-list"></div></div>
        </details>
    </section>
</main>

<button id="calculator-launcher" class="calculator-launcher" type="button" aria-controls="calculator-panel" aria-expanded="false">计算器</button>

<section id="calculator-panel" class="calculator-panel" aria-label="机考科学计算器" hidden>
    <div id="calculator-drag-handle" class="calculator-titlebar">
        <strong>计算器</strong>
        <span class="calculator-title-note">机考练习</span>
        <button id="calculator-close" class="calculator-window-button" type="button" aria-label="关闭计算器">×</button>
    </div>

    <div class="calculator-body">
        <div class="calculator-display-wrap">
            <div id="calculator-history" class="calculator-history"></div>
            <input id="calculator-display" class="calculator-display" type="text" value="0" readonly aria-label="计算器显示屏">
        </div>

        <div class="calculator-mode-row" aria-label="角度模式">
            <label><input type="radio" name="calculator-angle" value="deg" checked> 度</label>
            <label><input type="radio" name="calculator-angle" value="rad"> 弧度</label>
            <span id="calculator-memory-indicator" class="calculator-memory-indicator"></span>
        </div>

        <div id="calculator-grid" class="calculator-grid">
            <button class="calculator-memory-key" type="button" data-action="memory-clear">MC</button>
            <button class="calculator-memory-key" type="button" data-action="memory-recall">MR</button>
            <button class="calculator-memory-key" type="button" data-action="memory-store">MS</button>
            <button class="calculator-memory-key" type="button" data-action="memory-add">M+</button>
            <button class="calculator-memory-key" type="button" data-action="memory-subtract">M−</button>

            <span class="calculator-spacer"></span>
            <button type="button" data-action="inverse" id="calculator-inverse">Inv</button>
            <button type="button" data-function="ln">ln</button>
            <button type="button" data-value="(">(</button>
            <button type="button" data-value=")">)</button>
            <button type="button" data-action="backspace">←</button>
            <button type="button" data-action="clear">CE</button>
            <button type="button" data-action="clear">C</button>
            <button type="button" data-action="sign">±</button>
            <button type="button" data-function="sqrt">√</button>

            <button type="button" data-function="int">Int</button>
            <button type="button" data-function="sinh">sinh</button>
            <button type="button" data-function="sin">sin</button>
            <button type="button" data-function="square">x²</button>
            <button type="button" data-function="factorial">n!</button>
            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" data-operator="/">÷</button>
            <button type="button" data-action="percent">%</button>

            <button type="button" data-constant="e">e</button>
            <button type="button" data-function="cosh">cosh</button>
            <button type="button" data-function="cos">cos</button>
            <button type="button" data-operator="power">xʸ</button>
            <button type="button" data-function="cuberoot">∛</button>
            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" data-operator="*">×</button>
            <button type="button" data-function="reciprocal">1/x</button>

            <button type="button" data-constant="pi">π</button>
            <button type="button" data-function="tanh">tanh</button>
            <button type="button" data-function="tan">tan</button>
            <button type="button" data-function="cube">x³</button>
            <button type="button" data-function="sqrt">√x</button>
            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" data-operator="-">−</button>
            <button type="button" data-action="equals" class="calculator-equals calculator-equals-tall">=</button>

            <button type="button" data-function="log">log</button>
            <button type="button" data-function="exp">eˣ</button>
            <button type="button" data-operator="mod">Mod</button>
            <button type="button" data-action="percent">%</button>
            <button type="button" data-function="cuberoot">∛x</button>
            <button type="button" data-value="0" class="calculator-zero-wide">0</button>
            <button type="button" data-value=".">.</button>
            <button type="button" data-operator="+">+</button>
        </div>
    </div>
</section>

<script src="plan.js?v=20260815-5"></script>
<script src="questions.js?v=20260815-5"></script>
<script src="app.js?v=20260815-5"></script>
<script src="calculator.js?v=20260815-5"></script>

</body>
</html>
